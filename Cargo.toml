[package]
name = "fix_local_mail"
authors = ["C. Pospiech <pospiech-HD@t-online.de>"]
version = "1.7.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
fs_extra = "1.3.0"
futures = "0.3.34"
gethostname = "1.1.0"
glob = "0.3.4"
rand = "0.9.5"
regex = "1.13.1"
sqlx = { version = "0.8.6", features = [ "mysql", "runtime-tokio-native-tls", "macros" ] }
tokio = { version = "1.53.1", features = [ "full" ] }
uuid = { version = "1.26", features = ["v4"] }
walkdir = "2"
zbus = "5.19.0"
